apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otel
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /var/run/otel/server/tls.crt
              key_file: /var/run/otel/server/tls.key
              client_ca_file: /var/run/otel/client-ca/ca.crt
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 1536
        spike_limit_mib: 384
      attributes/privacy:
        actions:
          - {key: enduser.id, action: delete}
          - {key: user.email, action: delete}
          - {key: payment.pan, action: delete}
          - {key: payment.pii, action: delete}
          - {key: http.request.header.authorization, action: delete}
          - {key: db.statement, action: delete}
      batch:
        timeout: 2s
        send_batch_size: 8192
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        send_timestamps: true
      otlp/backend:
        endpoint: ${env:OTEL_BACKEND_ENDPOINT}
        tls:
          ca_file: /var/run/otel/backend-ca/ca.crt
        sending_queue:
          enabled: true
          storage: file_storage
          num_consumers: 16
          queue_size: 100000
        retry_on_failure:
          enabled: true
          max_elapsed_time: 1h
    service:
      extensions: [health_check, file_storage]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, otlp/backend]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/privacy, batch]
          exporters: [otlp/backend]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-gateway
    spec:
      serviceAccountName: otel-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: otel-gateway
              topologyKey: payment.example/dc
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: payment.example/dc
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: otel-gateway
      containers:
        - name: collector
          image: registry.invalid/open-telemetry/opentelemetry-collector-contrib:0.135.0-replace-with-signed-digest
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: OTEL_BACKEND_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: otel-backend
                  key: endpoint
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: prometheus, containerPort: 8889}
            - {name: health, containerPort: 13133}
          startupProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          resources:
            requests: {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}
            limits: {cpu: "4", memory: 2Gi, ephemeral-storage: 20Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
            - {name: server-tls, mountPath: /var/run/otel/server, readOnly: true}
            - {name: client-ca, mountPath: /var/run/otel/client-ca, readOnly: true}
            - {name: backend-ca, mountPath: /var/run/otel/backend-ca, readOnly: true}
            - {name: queue, mountPath: /var/lib/otel}
      volumes:
        - name: config
          configMap: {name: otel-gateway-config}
        - name: server-tls
          secret: {secretName: otel-gateway-server-tls, defaultMode: 0400}
        - name: client-ca
          configMap: {name: otel-client-ca}
        - name: backend-ca
          secret: {secretName: otel-backend-ca, defaultMode: 0444}
        - name: queue
          emptyDir: {sizeLimit: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: prometheus, port: 8889, targetPort: prometheus}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-gateway
  namespace: observability
spec:
  minAvailable: 3
  unhealthyPodEvictionPolicy: IfHealthyBudget
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
