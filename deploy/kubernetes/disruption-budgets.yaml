apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-api
  namespace: payments
spec:
  # Preserve at least one pod outside any three voluntarily drained DCs.
  minAvailable: 9
  unhealthyPodEvictionPolicy: IfHealthyBudget
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-publisher
  namespace: payments
spec:
  minAvailable: 9
  unhealthyPodEvictionPolicy: IfHealthyBudget
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-publisher
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reconciliation-worker
  namespace: payments
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: IfHealthyBudget
  selector:
    matchLabels:
      app.kubernetes.io/name: reconciliation-worker
