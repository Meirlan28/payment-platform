apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cockroachdb-site
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cockroachdb
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - {port: 26257, protocol: TCP}
        - {port: 26357, protocol: TCP}
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payment-api, outbox-publisher, schema-migrator, reference-migration, database-identities-bootstrap, cockroach-bootstrap]
      ports:
        - {port: 26257, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - {port: 26257, protocol: TCP}
        - {port: 26357, protocol: TCP}
    # The 12 private DC CIDRs are mandatory environment-specific overlays.
