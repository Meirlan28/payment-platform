apiVersion: v1
kind: ConfigMap
metadata: {name: cockroach-site, namespace: payments}
data: {DC_ID: dc-10, REGION_ID: mea, ADVERTISE_SUFFIX: cockroach.dc-10.payments.internal}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: cockroachdb, namespace: payments}
spec: {template: {spec: {volumes: [{name: node-tls, csi: {volumeAttributes: {csi.cert-manager.io/dns-names: "${POD_NAME}.cockroachdb.payments.svc.cluster.local,*.cockroach.dc-10.payments.internal,cockroach.dc-10.payments.internal,cockroach-public.payments.svc.cluster.local"}}}]}}}

