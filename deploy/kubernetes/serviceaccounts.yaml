apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-api
  namespace: payments
  annotations:
    # Replace with the cloud workload-identity binding for this environment.
    payment.example/workload-identity: payment-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-cert-issuer
  namespace: payments
  annotations:
    payment.example/workload-identity: cert-manager-vault-pki
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schema-migrator
  namespace: payments
  annotations:
    payment.example/workload-identity: schema-migrator
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reference-migration
  namespace: payments
  annotations:
    payment.example/workload-identity: reference-migration
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reconciliation-worker
  namespace: payments
  annotations:
    payment.example/workload-identity: reconciliation-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-checkpointer
  namespace: payments
  annotations:
    # The pod receives three explicit 10-minute projected tokens with distinct
    # audiences; no static Vault/S3 credential is mounted.
    payment.example/workload-identity: audit-checkpointer
automountServiceAccountToken: false
