# Intentionally excluded from the default kustomization. Apply this file from a
# reviewed release pipeline after backup/compatibility gates; Jobs are immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-migrator-release-id
  namespace: payments
  labels:
    app.kubernetes.io/name: schema-migrator
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-migrator
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: schema-migrator
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema-migrator
          image: registry.invalid/payment-platform/schema-migrator:replace-with-signed-digest
          imagePullPolicy: IfNotPresent
          env:
            - name: MIGRATIONS_DIR
              value: /migrations
            - name: DATABASE_URL
              value: >-
                postgresql://root@cockroach-public.payments.svc.cluster.local:26257/payment_platform?sslmode=verify-full&sslrootcert=/var/run/cockroach/ca/ca.crt&sslcert=/var/run/cockroach/client/tls.crt&sslkey=/var/run/cockroach/client/tls.key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cockroach-client
              mountPath: /var/run/cockroach/client
              readOnly: true
            - name: cockroach-ca
              mountPath: /var/run/cockroach/ca
              readOnly: true
      volumes:
        - name: cockroach-client
          secret:
            secretName: schema-migrator-cockroach-client-tls
            defaultMode: 0400
        - name: cockroach-ca
          configMap:
            name: cockroach-public-ca

