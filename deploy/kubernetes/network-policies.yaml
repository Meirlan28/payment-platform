apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: payments
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-api-ingress
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: ingress
          podSelector:
            matchLabels:
              payment.example/mtls-client: "true"
      ports:
        - port: 8443
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: monitoring
      ports:
        - port: 8889
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-api-egress
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - {port: 26257, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-gateway
      ports:
        - {port: 4317, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outbox-publisher
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: outbox-publisher
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: monitoring
      ports:
        - {port: 8889, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - {port: 26257, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: payments-kafka
      ports:
        - {port: 9094, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-gateway
      ports:
        - {port: 4317, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controlled-db-jobs-egress
  namespace: payments
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [schema-migrator, reference-migration, database-identities-bootstrap, cockroach-bootstrap]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - {port: 26257, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reconciliation-worker
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reconciliation-worker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: monitoring
      ports:
        - {port: 8889, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - {port: 26257, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-gateway
      ports:
        - {port: 4317, protocol: TCP}
---
# Cockroach node-to-node RPC and SQL are TLS-only. Cross-cluster implementations
# must enforce the same policy at the CNI/firewall layer for the 12 DC CIDRs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cockroachdb
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cockroachdb
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - {port: 26357, protocol: TCP}
        - {port: 26257, protocol: TCP}
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payment-api, outbox-publisher, reconciliation-worker, audit-checkpointer, schema-migrator, reference-migration, database-identities-bootstrap, cockroach-bootstrap]
      ports:
        - {port: 26257, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: monitoring
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - {port: 26357, protocol: TCP}
        - {port: 26257, protocol: TCP}
