apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: payments-kafka
  namespace: payments
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.1
    # The operator mapping is not trusted to select a mutable tag. The release
    # overlay replaces this fail-closed reference with an approved Kafka 4.3.1
    # image digest supported by the pinned Strimzi operator.
    image: registry.invalid/apache/kafka:4.3.1-replace-with-signed-digest
    metadataVersion: 4.3-IV0
    rack:
      topologyKey: payment.example/dc
    listeners:
      - name: mtls
        port: 9093
        type: internal
        tls: true
        authentication: {type: tls}
      - name: sasl
        port: 9094
        type: internal
        tls: true
        authentication: {type: scram-sha-512}
    authorization:
      type: simple
      superUsers:
        - CN=kafka-platform-admin
    config:
      auto.create.topics.enable: "false"
      default.replication.factor: 7
      min.insync.replicas: 4
      offsets.topic.replication.factor: 7
      transaction.state.log.replication.factor: 7
      transaction.state.log.min.isr: 4
      unclean.leader.election.enable: "false"
      controlled.shutdown.enable: "true"
      ssl.enabled.protocols: TLSv1.3,TLSv1.2
      num.partitions: 1
    template:
      pod:
        terminationGracePeriodSeconds: 120
        securityContext:
          runAsNonRoot: true
          seccompProfile: {type: RuntimeDefault}
      kafkaContainer:
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
  entityOperator:
    topicOperator:
      resources:
        requests: {cpu: 200m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
    userOperator:
      resources:
        requests: {cpu: 200m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
  kafkaExporter:
    groupRegex: payments-.*
    topicRegex: payment-.*
    resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
