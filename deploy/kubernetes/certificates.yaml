  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [client auth]
  uris:
    - spiffe://payments.example/service/reconciliation-worker-telemetry
  issuerRef:
    name: workload-vault-pki
