apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-checkpointer
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audit-checkpointer
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: monitoring
      ports:
        - {port: 8889, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - {port: 26257, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - {port: 8200, protocol: TCP}
    # Each S3/STS private endpoint lives in a separately administered
    # namespace/account. Cloud deployments replace these two namespace peers
    # with reviewed egress-gateway/CIDR overlays; default-deny remains intact.
    - to:
        - namespaceSelector:
            matchLabels:
              payment.example/audit-worm-domain: worm-a
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              payment.example/audit-worm-domain: worm-b
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              payment.example/trust-domain: monitoring
      ports:
        - {port: 4317, protocol: TCP}
